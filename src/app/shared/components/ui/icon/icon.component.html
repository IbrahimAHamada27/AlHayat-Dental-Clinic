<svg
  class="app-icon"
  [ngClass]="[sizeClass(), customClass()]"
  [attr.aria-hidden]="ariaHidden()"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.8"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  @switch (name()) {
    @case ('phone') {
      <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" />
    }
    @case ('whatsapp') {
      <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" />
    }
    @case ('location') {
      <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
      <circle cx="12" cy="10" r="3" />
    }
    @case ('calendar') {
      <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
      <line x1="16" y1="2" x2="16" y2="6" />
      <line x1="8" y1="2" x2="8" y2="6" />
      <line x1="3" y1="10" x2="21" y2="10" />
    }
    @case ('clock') {
      <circle cx="12" cy="12" r="10" />
      <polyline points="12 6 12 12 16 14" />
    }
    @case ('home') {
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
      <polyline points="9 22 9 12 15 12 15 22" />
    }
    @case ('chevron-start') {
      <polyline class="rtl-flip" points="15 18 9 12 15 6" />
    }
    @case ('chevron-end') {
      <polyline class="rtl-flip" points="9 18 15 12 9 6" />
    }
    @case ('chevron-down') {
      <polyline points="6 9 12 15 18 9" />
    }
    @case ('chevron-up') {
      <polyline points="18 15 12 9 6 15" />
    }
    @case ('arrow-start') {
      <line class="rtl-flip" x1="19" y1="12" x2="5" y2="12" />
      <polyline class="rtl-flip" points="12 19 5 12 12 5" />
    }
    @case ('arrow-end') {
      <line class="rtl-flip" x1="5" y1="12" x2="19" y2="12" />
      <polyline class="rtl-flip" points="12 5 19 12 12 19" />
    }
    @case ('close') {
      <line x1="18" y1="6" x2="6" y2="18" />
      <line x1="6" y1="6" x2="18" y2="18" />
    }
    @case ('menu') {
      <line x1="3" y1="12" x2="21" y2="12" />
      <line x1="3" y1="6" x2="21" y2="6" />
      <line x1="3" y1="18" x2="21" y2="18" />
    }
    @case ('check') {
      <polyline points="20 6 9 17 4 12" />
    }
    @case ('alert-circle') {
      <circle cx="12" cy="12" r="10" />
      <line x1="12" y1="8" x2="12" y2="12" />
      <line x1="12" y1="16" x2="12.01" y2="16" />
    }
    @case ('info') {
      <circle cx="12" cy="12" r="10" />
      <line x1="12" y1="16" x2="12" y2="12" />
      <line x1="12" y1="8" x2="12.01" y2="8" />
    }
    @case ('user') {
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
      <circle cx="12" cy="7" r="4" />
    }
    @case ('star') {
      <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
    }
    @case ('award') {
      <circle cx="12" cy="8" r="7" />
      <polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88" />
    }
    @case ('external-link') {
      <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
      <polyline points="15 3 21 3 21 9" />
      <line x1="10" y1="14" x2="21" y2="3" />
    }
    @case ('facebook') {
      <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z" />
    }
    @case ('instagram') {
      <rect x="2" y="2" width="20" height="20" rx="5" ry="5" />
      <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z" />
      <line x1="17.5" y1="6.5" x2="17.51" y2="6.5" />
    }
    @case ('tooth-align') {
      <!-- Minimal Medical Orthodontics / Tooth Alignment Stroke Icon -->
      <path d="M7 4C5.5 4 4 5.5 4 8c0 4 2 10 3.5 12 1.5-2 2.5-6 2.5-9 0-2.5-1.5-4-3-4z" />
      <path d="M17 4c-1.5 0-3 1.5-3 4 0 3 1 7 2.5 9 1.5-2 3.5-8 3.5-12 0-2.5-1.5-4-3-4z" />
      <line x1="3" y1="10" x2="21" y2="10" stroke-dasharray="2 2" />
    }
    @case ('tooth-fill') {
      <!-- Minimal Medical Restorative Tooth Icon -->
      <path d="M12 3C8 3 5 5 5 9c0 5 3 11 5 12 1-1 2-4 2-7 0 3 1 6 2 7 2-1 5-7 5-12 0-4-3-6-7-6z" />
      <path d="M10 9h4" />
      <path d="M12 7v4" />
    }
    @case ('root-canal') {
      <!-- Precision Medical Endodontics Icon -->
      <path d="M12 2C8 2 5 4.5 5 8.5c0 5 4 12.5 7 13.5 3-1 7-8.5 7-13.5C19 4.5 16 2 12 2z" />
      <line x1="12" y1="7" x2="12" y2="16" />
      <line x1="10" y1="10" x2="14" y2="10" />
    }
    @case ('sparkle') {
      <!-- Cosmetic Aesthetics Sparkle -->
      <path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z" />
    }
    @case ('shield-check') {
      <!-- Periodontal & Clinical Protection -->
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
      <polyline points="9 12 11 14 15 10" />
    }
    @case ('heart-pulse') {
      <!-- Pediatric & Human Care -->
      <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" />
      <path d="M3.22 12H9.5l1.5-3 2 6 1.5-3h4.78" />
    }
    @default {
      <circle cx="12" cy="12" r="9" />
    }
  }
</svg>
