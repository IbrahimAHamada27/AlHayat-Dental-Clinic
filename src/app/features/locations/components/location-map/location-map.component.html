<div class="location-map-card" [attr.aria-label]="'خريطة وإرشادات الوصول إلى ' + location().nameAr">
  <div class="map-visual-frame">
    <iframe
      [src]="safeMapUrl()"
      class="live-google-map"
      loading="lazy"
      allowfullscreen
      referrerpolicy="no-referrer-when-downgrade"
      [title]="'خريطة موقع ' + location().nameAr"
    ></iframe>
    <div class="map-branch-floating-badge">
      <app-icon name="location" size="xs" />
      <span>{{ location().nameAr }}</span>
    </div>
  </div>

  <div class="map-footer-content">
    <div class="directions-guide-text">
      <app-icon name="info" size="xs" class="guide-icon" />
      <p class="guide-desc">{{ location().directionsAr || location().addressAr }}</p>
    </div>

    <app-button
      variant="primary"
      size="md"
      iconStart="location"
      [ariaLabel]="'فتح اتجاهات الوصول إلى ' + location().nameAr + ' على خرائط جوجل'"
      (btnClick)="onOpenMap()"
      class="w-full"
    >
      فتح الاتجاهات المباشرة في Google Maps
    </app-button>
  </div>
</div>
