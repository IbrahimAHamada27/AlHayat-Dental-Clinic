<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#f1f5f3" />
  <rect x="20" y="20" width="760" height="460" rx="12" fill="#ffffff" stroke="#cbdcd5" stroke-width="2" />
  <!-- Clinical Schematic Diagram for Misaligned/Crowded Teeth -->
  <g transform="translate(400, 220)" text-anchor="middle">
    <circle cx="0" cy="0" r="70" fill="#edf4f0" stroke="#0e3d36" stroke-width="2" stroke-dasharray="6 4" />
    <path d="M-60,-20 Q-30,-45 0,-20 Q30,-45 60,-20 Q40,30 0,40 Q-40,30 -60,-20 Z" fill="#ffffff" stroke="#c0392b" stroke-width="3" />
    <path d="M-30,-15 L-10,10 L10,-10 L30,15" stroke="#e74c3c" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <text y="110" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#0e3d36">حالة ازدحام وتراكب الأسنان (قبل العلاج)</text>
    <text y="140" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#527067">صورة توضيحية سريرية — عيادة الحياة لطب الأسنان</text>
